name: Send Slack notification

on:
  # Run this workflow from other workflows
  workflow_call:
    inputs:
      commit_id:
        description: 'HEAD commit hash'
        required: true
        type: string
      job_name:
        description: 'Job name to report on'
        required: true
        type: string
      status:
        description: 'Job status'
        required: true
        type: string
      title:
        description: 'Notification title'
        required: true
        type: string
      title_link:
        description: 'Notification title link'
        required: true
        type: string
      channel:
        description: 'Slack channel to send notification to'
        required: false
        type: string
        default: '#deploys'
    secrets:
      slack_webhook_url:
        required: true

jobs:
  slack_notification:
    runs-on: ubuntu-latest
    steps:
      - name: Get associated PR info
        run: |
          response=$(curl -s https://api.github.com/repos/${{ github.repository }}/commits/${{ inputs.commit_id }}/pulls)
          echo "PR_URL=$(jq -r '.[].html_url' <<< "${response}")" >> $GITHUB_ENV
          echo "PR_TITLE=$(jq -r '.[].title' <<< "${response}")" >> $GITHUB_ENV

      - name: Prepare status env vars
        id: status-vars
        run: |
          if [ "${{ inputs.status }}" = "success" ]; then
            echo "COLOR=good" >> $GITHUB_ENV
            echo "STATUS_TEXT=:white_check_mark: Success" >> $GITHUB_ENV
          elif [ "${{ inputs.status }}" = "failure" ]; then
            echo "COLOR=danger" >> $GITHUB_ENV
            echo "STATUS_TEXT=:x: Failed" >> $GITHUB_ENV
          else
            echo "COLOR=warning" >> $GITHUB_ENV
            echo "STATUS_TEXT=:warning: Warning" >> $GITHUB_ENV
          fi

      - name: Slack notification
        uses: slackapi/slack-github-action@v3
        env:
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
          SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}
        with:
          payload: |
            {
              "channel": "${{ inputs.channel }}",
              "icon_emoji": ":octocat:",
              "username": "Deploy Action",
              "attachments": [{
                "color": "${{ env.COLOR }}",
                "author_name": "${{ github.actor }}",
                "author_link": "https://github.com/${{ github.actor }}/",
                "author_icon": "https://github.com/${{ github.actor }}.png?size=40",
                "title": "${{ inputs.title }}",
                "title_link": "${{ inputs.title_link }}",
                "fields": [
                    {
                        "title": "Status",
                        "value": "${{ env.STATUS_TEXT }}",
                        "short": true
                    },
                    {
                        "title": "Triggered by",
                        "value": "${{ github.event_name }}",
                        "short": true
                    },
                    {
                      "title": "Initiated by",
                      "value": "<${{ env.PR_URL }}|${{ env.PR_TITLE }}>"
                    },
                    {
                        "title": "Run Link",
                        "value": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                ],
                "thumb_url": "https://raw.githubusercontent.com/zooniverse/Brand/master/style%20guide/logos/zooniverse-emblem/zooniverse-logo-teal.png",
                "footer": "<https://github.com/${{ github.repository }}|${{ github.repository }}> #${{ github.run_number }}",
                "footer_icon": "https://www.zooniverse.org/favicon.ico"
              }]
            }
